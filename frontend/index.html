<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>NovaMusic Pro</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">

<h2>🎧 NovaMusic</h2>

<button>🏠 Home</button>
<button>🔎 Search</button>
<button>📁 Library</button>
<button onclick="openUpload()">➕ Upload</button>

<div class="playlists">
<h3>Playlists</h3>
<div id="playlistList"></div>
</div>

</div>

<!-- MAIN -->
<div class="main">

<h1>Bienvenue 👋</h1>

<div id="songs"></div>

</div>

<!-- PLAYER -->
<div class="player">

<button onclick="prev()">⏮</button>
<button onclick="togglePlay()">▶ / ⏸</button>
<button onclick="next()">⏭</button>

<input type="range" id="progress" value="0">

<span id="current">0:00</span>

</div>

</div>

<!-- UPLOAD -->
<input type="file" id="upload" hidden onchange="uploadMusic(event)">

<script src="app.js"></script>

</body>
</html>
